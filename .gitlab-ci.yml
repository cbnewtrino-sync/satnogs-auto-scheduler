variables:
  GITLAB_CI_IMAGE_PYTHON3: 'python:3.11'
  GITLAB_CI_PYPI_TOX: 'tox~=4.17.1'
  GITLAB_CI_PYPI_RUFF: 'ruff~=0.5.7'
  GITLAB_CI_PYPI_HATCH: 'hatch~=1.12.0'

  GITLAB_CI_DOCKER_BUILDX_PLATFORMS: 'linux/amd64,linux/arm/v7,linux/arm64'
  GITLAB_CI_DOCKER_IMAGE_NAME: 'satnogs-auto-scheduler'
  GITLAB_CI_DOCKER_PULL: '1'
  GITLAB_CI_DOCKER_IMAGE_TAG_LATEST: '${CI_COMMIT_TAG}'

stages:
  - static
  - build
  - deploy

include:
  - project: 'librespacefoundation/templates/gitlab-ci'
    ref: '49bc98ac14e67d048eb7d39120b0504a8afddda5'
    file: '.gitlab-ci-docker.yml'

lint:
  stage: static
  image: ${GITLAB_CI_IMAGE_PYTHON3}
  before_script:
    - pip install "$GITLAB_CI_PYPI_RUFF"
  script:
    - ruff check --output-format=gitlab . > quality.json
  artifacts:
    reports:
      codequality: quality.json

test:
  stage: static
  image: ${GITLAB_CI_IMAGE_PYTHON3}
  before_script:
    - pip install "$GITLAB_CI_PYPI_TOX"
  script:
    - tox -e "pytest"

build:
  stage: build
  image: ${GITLAB_CI_IMAGE_PYTHON3}
  before_script:
    - pip install "$GITLAB_CI_PYPI_HATCH"
  script:
    - hatch build
  artifacts:
    paths:
    - dist/

docker:
  stage: deploy
  variables:
    GITLAB_CI_DOCKER_IMAGE_VERSION: '${CI_COMMIT_REF_NAME}'
