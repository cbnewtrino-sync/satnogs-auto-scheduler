variables:
  GITLAB_CI_IMAGE_PYTHON3: 'python:3.11'
  GITLAB_CI_PYPI_TOX: 'tox~=4.17.1'
  GITLAB_CI_PYPI_RUFF: 'ruff~=0.5.7'
  GITLAB_CI_PYPI_HATCH: 'hatch~=1.16.0'

stages:
  - static
  - build
  - deploy

include:
  - project: 'librespacefoundation/templates/gitlab-ci'
    ref: 'ed44d9741ba9d13ff097b85cbd6ce7c11af3ee8c'
    file: '.gitlab-ci-docker.yml'

lint:
  stage: static
  image: ${GITLAB_CI_IMAGE_PYTHON3}
  before_script:
    - pip install "$GITLAB_CI_PYPI_RUFF"
  script:
    - ruff check --output-format=gitlab . > quality.json
  artifacts:
    reports:
      codequality: quality.json

test:
  stage: static
  image: ${GITLAB_CI_IMAGE_PYTHON3}
  before_script:
    - pip install "$GITLAB_CI_PYPI_TOX"
  script:
    - tox -e "pytest"

build:
  stage: build
  image: ${GITLAB_CI_IMAGE_PYTHON3}
  before_script:
    - pip install "$GITLAB_CI_PYPI_HATCH"
  script:
    - hatch build
  artifacts:
    paths:
    - dist/

docker:
  variables:
    GITLAB_CI_DOCKER_IMAGE_NAME: 'satnogs-auto-scheduler'
    GITLAB_CI_DOCKER_BUILDX_PLATFORMS: 'linux/amd64,linux/arm64,linux/armhf'
    GITLAB_CI_DOCKER_PULL: '1'
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        GITLAB_CI_DOCKER_IMAGE_TAG_LATEST: '1'
        GITLAB_CI_DOCKER_IMAGE_TAG_LATEST_NAME: '${CI_COMMIT_REF_NAME}'
        GITLAB_CI_DOCKER_IMAGE_VERSION: ''
    - if: $CI_COMMIT_TAG
      variables:
        GITLAB_CI_DOCKER_IMAGE_TAG_LATEST: ''
        GITLAB_CI_DOCKER_IMAGE_TAG_LATEST_NAME: ''
        GITLAB_CI_DOCKER_IMAGE_VERSION: '${CI_COMMIT_TAG}'
